name: Build Standalone Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract ZIP & Build APK
        run: |
          # 1. ZIP ဖိုင်ရှိရင် အလိုအလျောက်ဖြည်မည်
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Extracting zip file..."
            unzip -o *.zip
          fi

          # 2. package.json ရှိရာ folder ကို ရှာမည်
          PKG_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: apk-builder.zip သို့မဟုတ် package.json ကို Repo ထဲသို့ အရင် Upload တင်ပေးပါ!"
            ls -la
            exit 1
          fi

          APP_DIR=$(dirname "$PKG_FILE")
          cd "$APP_DIR"

          # 3. Web App ကို Build လုပ်မည်
          bun install || npm install --legacy-peer-deps
          bun run build || npx vite build

          # 4. Capacitor ဖြင့် Android APK ပြောင်းမည်
          bun add @capacitor/core @capacitor/cli @capacitor/android || npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Prompt Builder Pro" "com.promptbuilderpro.app" --web-dir dist
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-out/PromptBuilderPro.apk"

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Builder-Pro-APK
          path: apk-out/PromptBuilderPro.apk
