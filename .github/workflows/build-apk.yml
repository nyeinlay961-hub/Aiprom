name: Build Standalone Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Project Dependencies
        run: npm install

      - name: Patch AiTestModal for Direct Standalone APK Execution
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Server မလိုဘဲ APK ထဲကနေ တိုက်ရိုက်အလုပ်လုပ်နိုင်အောင် Vite Env ချိတ်ဆက်ခြင်း
          echo "VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY}" > .env.production
          npm run build

      - name: Install & Initialize Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Prompt Builder Pro" "com.promptbuilderpro.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Builder-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
